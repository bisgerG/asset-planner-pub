<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的投資計劃書</title>
<meta name="description" content="把「① 配資金」與「② 挑時機」的結果整理成一份可以列印、可以照著做的投資計劃書。">
<link rel="stylesheet" href="../assets/ui.css">
<style>
/* 本頁專屬版面。token、body、.wrap、.sitenav、.btn 來自 assets/ui.css。 */
:root{ --wrap:860px }
body{font-size:14.5px;line-height:1.62}
.wrap{padding:14px 16px 60px}

.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px;margin-top:14px}
h1{font-size:26px;margin:0 0 4px;color:var(--navy);letter-spacing:-.4px}
.meta{color:var(--muted);font-size:13px;margin:0 0 6px}
section{margin:26px 0 0;break-inside:avoid}
section>h2{font-size:17px;margin:0 0 10px;color:var(--navy);padding-bottom:5px;border-bottom:2px solid var(--gold);display:inline-block}
section>.lead{margin:0 0 10px;color:var(--muted);font-size:13.5px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12.5px;background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:8px 0}
.kv>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-size:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--gold);background:#fffdf5;padding:9px 13px;margin:10px 0;font-size:13.5px}
.note.warn{border-left-color:var(--warn);background:#fdf5ec}
.note.ok{border-left-color:var(--ok);background:#f2f9f4}
/* 行為層①②③(IA §5.5:從 /plan/ tab4 搬來,當簽名前的最後一段話)。
   刻意不折疊 —— 這份文件是印出來的,折疊在紙上等於刪掉。 */
.behav{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:12px 15px;margin:14px 0 10px;font-size:13px;line-height:1.8}
.behav p{margin:0 0 9px} .behav p:last-child{margin-bottom:0}
.behav .bh{color:var(--navy);font-weight:700;font-size:13.5px}
.pledge{border:1.5px dashed var(--muted);border-radius:9px;padding:12px 15px;margin:10px 0;font-size:13.5px}
.pledge .line{border-bottom:1px solid var(--ink);height:19px;margin:10px 0 3px}
.mut{color:var(--muted)}
b.bad{color:var(--bad)} b.ok{color:var(--ok)} b.wn{color:var(--warn-ink)}
canvas{width:100%;height:190px;display:block}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}

@media (max-width:600px){ .sheet{padding:18px 15px} h1{font-size:21px} }

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.5}
  .wrap{max-width:none;padding:0}
  .noprint{display:none !important}
  .sheet{border:0;border-radius:0;padding:0;margin:0}
  section{margin:14pt 0 0;page-break-inside:avoid}
  section>h2{font-size:12.5pt}
  table{font-size:9.5pt} th,td{padding:3px 6px}
  .kv>div{padding:5px 8px} .kv .v{font-size:13pt}
  .behav{font-size:9.5pt;line-height:1.65;padding:8px 11px;background:#fff;border-color:#bbb}
  canvas{height:150px}
  a{color:inherit;text-decoration:none}
  /* 名詞氣泡在螢幕上有用,印出來只是每個術語後面多一個問號。
     這份文件的用途是簽名、貼冰箱 —— 印刷版要乾淨。 */
  .term{border-bottom:0}
  .term::after{content:""}
}
</style>
</head>
<body>
<div class="wrap">

  <nav id="apNav" class="noprint"></nav>

  <div class="noprint" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
    <button class="btn" id="printBtn" type="button">🖨 列印 / 存成 PDF</button>
    <a class="btn ghost" href="../plan-result/">★ 回我的計畫</a>
    <a class="btn ghost" href="../plan/#portfolio">⚙ 回去改設定</a>
    <span class="mut" style="font-size:12.5px">列印時選「另存為 PDF」就有一份可以收起來的文件。</span>
  </div>

  <div class="sheet" id="sheet">
    <div class="empty">讀取中…</div>
  </div>
</div>

<script src="../assets/engine.js"></script>
<script src="../assets/charts.js"></script>
<script src="../assets/state.js"></script>
<script src="../assets/shell.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const E=APEngine;
// 名詞註解要等 #sheet 填完才掃(整份文件是 JS 一次寫進去的),所以這裡先不掃。
APShell.init({page:'report', glossary:false});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d)=>(v==null||!isFinite(v))?'—':(v*100).toFixed(d==null?1:d)+'%';
const wan=v=>{ // 萬 → 億 自動換算,與 plan 的 fmtW 同口徑
  if(v==null||!isFinite(v))return '—';
  const a=Math.abs(v);
  if(a>=10000)return (v/10000).toFixed(2)+'億';
  return (a>=100?Math.round(v):Math.round(v*10)/10)+'萬';
};
const ntd=v=>(v==null||!isFinite(v))?'—':Math.round(v*10000).toLocaleString('zh-TW')+' 元';

const MECH={both:'偏離帶再平衡 ＋ 崩盤分批加碼',rebal:'只做偏離帶再平衡',
  reserve:'只做崩盤分批加碼',deep3:'三段深觸發 −25/−35/−45(與「② 挑時機」同一張表)',
  orig:'712 原型(深觸發 −25/−40)',bh:'買進持有,完全不動'};

// 加碼水位與投入比例改吃 assets/engine.js 的單一真相(SPEC C17)——
// 原本這裡複製了一份常數,靠註解要求「必須與 plan/index.html 一致」。
// 標的顯示名同理:直接問引擎,不再自己維護一份會過時的對照表。

const R=APState.getResult();
const F=APState.getFounding();

if(!R||!R.in){
  $('sheet').innerHTML='<div class="empty"><h1>還沒有可以輸出的計畫</h1>'
    +'<p>計劃書是把你的計畫排版成一份可以印出來、簽名、貼冰箱的文件。<br>'
    +'請先回答九個白話問題(約 3 分鐘),再回來這裡。</p>'
    +'<p style="margin-top:18px"><a class="btn" href="../start/">開始(約 3 分鐘) →</a></p>'
    +'<p class="mut" style="font-size:12.5px;margin-top:16px">已經自己填過參數?到 '
    +'<a href="../plan/">⚙ 配資金</a>按一次「▶ 重新計算」也可以。</p></div>';
  return;
}

const I=R.in, K=R.risk||{}, MS=R.ms||{};
// 標的顯示名:用這份計畫自己存下來的成本假設重建 defs,名字就一定與 /plan/ 當時看到的一致。
const NAMES=(()=>{const d=E.assetDefs(I.carry,I.volDrag,I.ssoFin),m={};
  E.ORDER.forEach(k=>m[k]=d[k].name);return m;})();
const monthly=(+I.mon||0);                       // 萬/月
const nextReview=(()=>{const d=new Date(R.updated+'T00:00:00');d.setDate(d.getDate()+90);
  return isNaN(d)?'—':d.toISOString().slice(0,10);})();

// 現金流 DSL 直接用引擎的 parseFlows —— 原本這裡有一份「只需要唯讀」的複製品,
// 兩份對敵意輸入的處理不完全一樣(它沒有擋負金額、沒有 clamp 錨點)。
const anchor=v=>v==='now'?'現在':v==='ret'?`退休(${I.retire} 歲)`:v==='max'?`${I.maxAge} 歲`:v==='once'?'一次性':`${v} 歲`;
const flows=E.parseFlows(I.flows);

let H='';

// 設定改過了就不要印出對不上的數字(docs/IA.md §6.2)。
// 只在「證明得了」時才亮 —— 從舊版 ap_report_v1 遷上來的結果沒有輸入雜湊,
// 那是「不知道」,不是「過期」,對它亮橫幅等於發假警報。
if(APState.isProvablyStale()){
  H+=`<div class="note warn noprint"><b>⚠ 設定改過了,這份計劃書還是舊的。</b>
    下面的數字是用<b>更動前</b>的設定算出來的,不要照著印。
    到「★ 我的計畫」看一眼就會自動重算(不必按任何按鈕),再回來列印。
    <div style="margin-top:8px"><a class="btn" href="../plan-result/">★ 去重新產生 →</a></div></div>`;
}

// ── 標題 ─────────────────────────────────────────────
H+=`<h1>我的投資計劃書</h1>
<p class="meta">產生日期 ${esc(R.updated)}　·　下次檢視日 <b>${esc(nextReview)}</b>　·
所有數字為<b>實質(今天購買力)</b>,由模擬產生,非保證。</p>`;

// ── 1 目標與現況 ─────────────────────────────────────
H+=`<section><h2>1 · 目標與現況</h2>
<div class="kv">
  <div><div class="k">現在年齡</div><div class="v">${I.age0} 歲</div></div>
  <div><div class="k">預計退休</div><div class="v">${I.retire} 歲</div></div>
  <div><div class="k">目前可投資資產</div><div class="v">${wan(I.net0)}</div></div>
  <div><div class="k">每月可再投入</div><div class="v">${wan(monthly)}</div></div>
  <div><div class="k">退休後年支出</div><div class="v">${wan(I.exp)}</div></div>
  <div><div class="k">需自備的本金(FIRE 數字)</div><div class="v">${wan(R.fireNum)}</div></div>
</div>
<p class="mut" style="font-size:13px">FIRE 數字 = (年支出 ${wan(I.exp)}${I.pension>0?` − 年金 ${wan(I.pension)}`:''}) ÷ ${pct(I.swr)} 提領率。
這是「4% 法則」式的粗估目標;真正回答「夠不夠」的是第 6 節的提領模擬。</p>
</section>`;

// ── 2 地基檢查 ───────────────────────────────────────
const FQ=[['chk1','6 個月以上的緊急預備金,放在投資之外'],['chk2','基本的醫療／失能／壽險保障'],
  ['chk3','沒有高利率負債(卡債、信貸)'],['chk4','用的是「賠光也不影響生活」的閒錢']];
const okN=F?FQ.filter(q=>F[q[0]]).length:0;
H+=`<section><h2>2 · 地基檢查</h2>
<p class="lead">這一步不用任何工具,但比後面每一步都重要。</p>`;
if(!F){
  H+=`<div class="note warn">還沒做過地基自測。<b>請先到<a href="../plan-result/">★ 我的計畫</a>的第 ❼ 段把 4 項確認一遍</b>——
    地基沒打好之前,下面的配置與加碼規則都不該執行。</div>`;
}else{
  H+='<table><tbody>'+FQ.map(q=>`<tr><td style="width:26px">${F[q[0]]?'✅':'⬜'}</td>
    <td>${esc(q[1])}</td></tr>`).join('')+'</tbody></table>';
  /* 緊急預備金 = **現在**年支出的一半(6 個月)。
     S9 之前用的是 I.exp —— 但那是**退休後**的年支出,借用它等於說
     「把退休預算調低的人,連緊急預備金也可以少準備」,那是錯的。
     舊結果沒有 spendNow 時退回 I.exp,數字與改版前完全相同。 */
  const emerg=(+I.spendNow>0?+I.spendNow:+I.exp)/2;
  H+= okN===4
    ? `<div class="note ok">地基 4/4,可以執行下面的計畫。<b>每年重看一次</b>——收入、保單、負債變了,地基也要重檢。</div>`
    : `<div class="note warn">地基 <b>${okN}/4</b>。${F.chk1?'':`緊急預備金建議先備妥約 <b>${wan(emerg)}</b>(半年支出),而且要<b>放在這套投資之外</b>。`}
       <b>沒補齊之前,建議先不要執行下面的配置</b>——尤其不要開槓桿。</div>`;
}
H+='</section>';

// ── 3 資金配置 ───────────────────────────────────────
const wKeys=Object.keys(R.w||{});
H+=`<section><h2>3 · 資金配置</h2>
<div class="kv">
  <div><div class="k">淨曝險(你真正的風險刻度)</div><div class="v">${pct(R.netExp,0)}</div></div>
  <div><div class="k">混合名目年化(假設)</div><div class="v">${pct(R.muNom)}</div></div>
  <div><div class="k">現金回市場機制</div><div class="v" style="font-size:14px">${esc(MECH[I.mech]||I.mech)}</div></div>
</div>
<table><thead><tr><th>標的</th><th class="n">目標比重</th><th class="n">對應金額</th></tr></thead><tbody>`
+wKeys.map(k=>`<tr><td>${esc(NAMES[k]||k)}</td><td class="n">${pct(R.w[k],1)}</td>
  <td class="n">${wan(I.net0*R.w[k])}</td></tr>`).join('')
+`</tbody><tfoot><tr><th>合計</th><th class="n">100.0%</th><th class="n">${wan(I.net0)}</th></tr></tfoot></table>
<p class="mut" style="font-size:13px">淨曝險 = Σ(比重 × 槓桿倍率)。100% ≈ 完全跟著大盤;
&gt;150% 屬積極。這是判斷「會不會被震出場」最該看的一個數字,不是報酬率。</p>`;
if(I.glide==1){
  H+=`<div class="note">已開啟<b>生命週期降槓桿</b>:從 <b>${I.glideStart} 歲</b>起到退休,
    會把約 70% 的槓桿部位逐步換成債券。愈接近退休、可承受的回撤愈小,這是刻意的。</div>`;
}
if(I.dcaMonths>0){
  H+=`<div class="note">現有資金<b>分 ${I.dcaMonths} 個月</b>投入(每月一筆,約 ${wan(I.net0/I.dcaMonths)}/月),
    不是一次全壓。準備金部位第一天就到位、不分批。</div>`;
}
H+='</section>';

// ── 4 每月執行 ───────────────────────────────────────
H+=`<section><h2>4 · 每月要做的事</h2>
<p class="lead">這是整份計畫裡唯一需要你每個月動手的部分。</p>`;
if(monthly>0){
  H+=`<table><thead><tr><th>標的</th><th class="n">每月投入</th><th class="n">約當台幣</th></tr></thead><tbody>`
  +wKeys.map(k=>`<tr><td>${esc(NAMES[k]||k)}</td><td class="n">${wan(monthly*R.w[k])}</td>
    <td class="n">${ntd(monthly*R.w[k])}</td></tr>`).join('')
  +`</tbody><tfoot><tr><th>合計</th><th class="n">${wan(monthly)}</th><th class="n">${ntd(monthly)}</th></tr></tfoot></table>
  <p class="mut" style="font-size:13px">金額不必抓到剛剛好,零股湊個整數就行;<b>持續</b>比精準重要得多。</p>`;
}else{
  H+=`<div class="note">目前設定為<b>不再新增投入</b>(每月可再投入 0)。既有部位照第 5 節的規則維護即可。</div>`;
}
H+='</section>';

// ── 5 維護規則 ───────────────────────────────────────
H+=`<section><h2>5 · 什麼時候該動手(平常不用動)</h2>`;
if(I.mech==='bh'){
  H+=`<div class="note">你選的是<b>買進持有</b>:除了每月投入以外,<b>什麼都不用做</b>。
    不再平衡、不加碼、不看盤。這是最省心、也最不容易做錯的一種。</div>`;
}else{
  if(I.mech==='rebal'||I.mech==='both'){
    H+=`<p><b>① 偏離帶再平衡</b>——每個月看一眼就好:當<b>任一標的偏離目標比重超過 50%</b>
      (例如目標 30%、實際變成 45% 或 15%),就把全部標的拉回上表的目標比重。沒超過就不要動。</p>`;
  }
  /* 加碼那一段要**真的加得動**才印:機制對、有現金、有槓桿部位三者缺一不可
     (`hasMech` 的前提,SPEC §3.5)。改版前只檢查機制,沒有現金時會印出一整排
     「0萬」—— 這是一份要列印簽名的文件,印一排零比不印那一段更糟。
     判準與 /plan-result/ ❹ 一致。 */
  const _lev=(R.w.L2||0)+(R.w.SSO||0)>1e-9;
  if(E.mechHasReserve(I.mech) && (R.w.CASH||0)>1e-9 && _lev){
    const bands=E.mechBands(I.mech), t=bands.THR, p=bands.POR;
    const reserve=I.net0*(R.w.CASH||0);
    H+=`<p><b>② 崩盤分批加碼</b>——只有在<b>大盤從最高點跌下來</b>時才動手。
      你的準備金是 <b>${wan(reserve)}</b>(現金部位 ${pct(R.w.CASH||0,0)}):</p>
      <table><thead><tr><th>大盤自高點回撤</th><th class="n">投入準備金的</th><th class="n">約當金額</th></tr></thead><tbody>`
      +t.map((lv,i)=>`<tr><td>跌到 <b>−${Math.abs(lv*100).toFixed(0)}%</b></td><td class="n">${(p[i]*100).toFixed(0)}%</td>
        <td class="n">${wan(reserve*p[i])}</td></tr>`).join('')
      +`</tbody></table>
      <p class="mut" style="font-size:13px">每個水位<b>只觸發一次</b>;等大盤創新高後,這些水位才重新計算。
      加碼的錢投進槓桿核心,不是隨便買。</p>`;
  }
  H+=`<div id="todayBox"></div>`;
}
H+=`<div class="note warn"><b>不該做的事:</b>看到新聞就調整、因為漲多了想「先獲利了結」、
  因為跌了想「等落底再進場」。這份計畫的所有數字,都建立在「你會照規則做」這個前提上——
  <b>這是所有假設裡最不可靠的一個</b>。</div>
</section>`;

// ── 6 退休提領計畫 ───────────────────────────────────
/* 定義取自 E.RISK_META(單一真相)。這一頁是**列印**用的:名詞氣泡點不開、
   也沒有 <details> 可以展開,所以四個指標的定義必須直接印在紙上。
   改版前這四個數字在這裡是完全裸奔的 —— 連 /plan-result/ 那行括號都沒有。 */
const RM=E.RISK_META;
H+=`<section><h2>6 · 退休以後怎麼領</h2>
<div class="kv">
  <div><div class="k">${RM.essOK.label}</div><div class="v">${pct(K.essOK)}</div></div>
  <div><div class="k">${RM.survive.label}</div><div class="v">${pct(K.survive)}</div></div>
  <div><div class="k">退休生活水準達成率(壞情境 P10)</div><div class="v">${pct(K.lifeP10)}</div></div>
  <div><div class="k">${RM.legacy.label}</div><div class="v">${wan(K.legacyMed)}</div></div>
</div>
<div class="note"><b>這四個數字各自在問什麼</b>(百分比的分母都是同樣那 1500 條模擬路徑):<br>
  ·<b>${RM.essOK.label}</b> —— ${RM.essOK.hint}。<b>這是頭條指標</b>,它問的是生活過不過得下去。<br>
  ·<b>${RM.survive.label}</b> —— ${RM.survive.hint}。它問的是<b>帳戶</b>,不是生活;
    年金蓋得住必要支出的人,就算投資部位被花光,日子照樣過得下去。<br>
