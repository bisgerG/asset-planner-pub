<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的計畫 — 資產規劃指南</title>
<meta name="description" content="一頁看完你該做的事:錢怎麼分、每個月做什麼、跌下來怎麼辦、最壞會有多壞。">
<link rel="stylesheet" href="../assets/ui.css">
<style>
/* 本頁專屬版面。token、body、.wrap、.sitenav、.btn、details.x/.adv、.src、.ap-risk
   與 S11 的 .ap-hero/.ap-stat/.ap-statrow/.ap-bar/.ap-confirm/.ap-chart
   全部來自 assets/ui.css。

   ── 這一頁是什麼(docs/IA.md §5.3)──────────────────────────────────
   整個重構的主要交付:**一頁看完「你該怎麼做」**,不用捲三次才看到結論。
   S11 版面:答案卡(幾歲) → 三件事行動條(兼頁內目錄) → ① 現在該做什麼
   → ② 最壞會有多壞 → 退休以後夠不夠(次級) → 地基。
   大題編號 ①② 是真實的行動順序,不是裝飾;原本 ❶~❼ 七塊視覺等重,
   新手分不出「要照做的」與「要理解的」。
   分層規則(docs/IA.md §3):
     L0 動作 —— 他明天要做什麼、做多少        → 永遠可見
     L1 代價 —— 這個動作最壞會怎樣            → 永遠可見,壓縮成一句話 + 一個金額
     L2 為什麼 —— 數字怎麼來的、其他選項如何  → 預設收合的「看細節」
     L3 全部 —— 完整參數與所有對照表          → 另一頁(/plan/、/timing/)
   **風險揭露即使不是「動作」也不准折疊**(§3.3 的例外條款)——
   本站的核心價值是「看清楚最壞會有多壞」,把 −52% 收進「看細節」等於把它刪掉。
   同一個數字這一頁最多出現兩次:行動條預覽一次 + 完整脈絡一次(S11 新規)。

   刻意不叫 .card / .panel:那兩個名字在 /plan/ 與 /timing/ 是同名不同物,
   在共用 CSS 裡定義任何一個都會弄壞其中一頁(見 assets/ui.css 開頭)。

   S11 起本頁樣式為 mobile-first:基準 = 手機,640px 以上疊加。 */
:root{ --wrap:760px }
.wrap{padding:12px 12px 56px}

/* ── 區塊 ─────────────────────────────────────────────── */
.sec{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:15px 14px; margin:12px 0 0}
.sec > h2{font-size:17px; margin:0 0 10px; color:var(--navy); display:flex; align-items:baseline; gap:8px}
.sec > h2 .n{font-size:15px; color:var(--core); font-weight:800; flex:none}
.sec > h2.minor{font-size:15px; color:var(--ink)}
/* ① 底下的小節:細虛線分隔,不與大題搶層級 */
.sec .sub-h{font-size:15px; color:var(--navy); font-weight:800; margin:18px 0 8px;
  padding-top:14px; border-top:1px dashed var(--line);
  display:flex; align-items:baseline; gap:8px}
.sec .sub-h:first-of-type{margin-top:2px; padding-top:0; border-top:0}
.sec .sub-h .tag{margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted)}
.lead{margin:0 0 10px; font-size:14px; line-height:1.8}
.mut{color:var(--muted)}
.small{font-size:13px; line-height:1.75}

/* ── 這一頁刻意**沒有**行長上限(--copy / .ap-measure)──────
   S11-P9 曾經套過 `.sec p{max-width:var(--copy)}`,撤掉了。原因:

   **本站是卡片式版面,每張卡都有看得見的邊 —— 那條邊就是量尺。**
   在卡片裡再給段落一個更窄的上限,兩者必然對不齊:實測 .sec 內容寬 688px,
   段落卻只有 442~476px,每段右邊空掉 200px 以上,讀起來像縮排壞掉
   (使用者實際回報:「字又歪掉了」)。同一張卡裡的表格、chips、方框又都是滿寬的,
   落差更明顯。

   要縮短行長,正確的旋鈕是 **--wrap**(整張卡變窄,字與邊一起收),
   不是逐段的 max-width。/report/ 與 /start/ 同樣理由、同樣撤掉。 */

/* ── 答案卡(共用 .ap-hero)的頁內補充 ──────────────────── */
.ap-hero .jargon{color:rgba(255,255,255,.62)}
.ap-hero .sub a{color:#dbe3f6}
/* 深藍底上的名詞氣泡 —— 照 ui.css 對 footer 的同一套處理。
   沒有這幾行,annotateTerms 標在答案卡裡的灰虛線＋灰問號等於隱形,
   於是那些定義只好用 .jargon 括號手寫在正文裡 —— 那正是答案卡變長的原因。 */
.ap-hero .term,.ap-hero .tip{border-bottom-color:#93a2cc}
.ap-hero .term::after,.ap-hero .tip::after{color:#93a2cc}
.ap-hero .term:hover,.ap-hero .tip:hover{border-bottom-color:var(--gold); color:var(--gold)}
.ap-hero .term:hover::after,.ap-hero .tip:hover::after{color:var(--gold)}
/* 機率帶圖鑲在答案卡裡的白色內襯 —— 圖的線是 navy 系,深底上看不見 */
.bandbox{background:#fff; border-radius:9px; padding:10px 10px 8px; margin-top:14px; color:var(--ink)}
.bandbox details.x{margin:2px 0 0}
.bandbox details.x > summary{font-size:12.5px}

/* ── 表 ───────────────────────────────────────────────── */
table{width:100%; border-collapse:collapse; margin:8px 0; font-size:13.5px}
th,td{padding:6px 9px; border-bottom:1px solid var(--line); text-align:left}
th{color:var(--muted); font-weight:600; font-size:12.5px; background:var(--panel)}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
tfoot th{background:transparent; color:var(--navy); font-size:13px}

/* ── 圓餅 + 圖例 ────────────────────────────────────────
   canvas 尺寸由 APCharts.donut 以 inline style 定死(148px,DPR 對齊),
   這裡只管排版:手機置中、寬屏靠左。 */
.alloc{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap}
.alloc canvas{flex:none; margin:0 auto}
.alloc .tbl{flex:1; min-width:230px}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:middle}

/* ── 一句話結論框(白話為主、術語為輔:docs/IA.md §7.1)─── */
.oneline{background:var(--panel); border:1px solid var(--line); border-radius:9px;
  padding:10px 13px; margin:10px 0 0; font-size:14.5px}
.oneline b{color:var(--navy); font-size:17px}

.note{border-left:3px solid var(--gold); background:#fffdf5; padding:9px 13px; margin:10px 0; font-size:13.5px; line-height:1.75}
.note.warn{border-left-color:var(--warn); background:#fdf5ec; color:var(--warn-ink)}
.note.ok{border-left-color:var(--good); background:#f2f9f4}

/* ── 每月投入的標的金額 chips ─────────────────────────── */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 6px}
.chips .chip{background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:3px 11px; font-size:12.5px; font-variant-numeric:tabular-nums}

/* ── ② 最壞會有多壞:比例條 ───────────────────────────── */
.worstbar{margin:10px 0 4px}
.worstbar .cap{display:flex; justify-content:space-between; gap:8px; font-size:12.5px;
  color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums}

/* ── 退休以後夠不夠:指標列表(S10)──────────────────────
   「名稱 ＋ 數字 ＋ 一行白話定義」擺在一起 —— 窄卡塞得下數字塞不下定義。 */
.mlist{margin:10px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.mlist>div{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:9px 12px; background:var(--panel); border-top:1px solid var(--line)}
.mlist>div:first-child{border-top:0}
.mlist .k{font-size:13.5px; font-weight:700; color:var(--navy)}
.mlist .v{font-size:18px; font-weight:800; color:var(--navy);
  font-variant-numeric:tabular-nums; margin-left:auto}
.mlist .d{flex-basis:100%; font-size:12px; color:var(--muted); line-height:1.65}

/* ── 地基 ─────────────────────────────────────────────── */
.chk{display:block; font-size:14px; line-height:1.6; margin:7px 0; cursor:pointer}
.chk input{margin-right:8px; transform:translateY(1px)}
#foundMsg{margin-top:10px; font-size:13.5px; font-weight:700}

/* ── 換一個風險等級的範本卡 ───────────────────────────── */
.famtoggle{display:flex; gap:6px; margin:2px 0 10px; flex-wrap:wrap}
.famtoggle button{font:inherit; font-size:13px; font-weight:700; padding:5px 13px; border-radius:999px;
  border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer}
.famtoggle button.active{background:var(--navy); color:#fff; border-color:var(--navy)}
.pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:9px}
.pcard{border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:#fff; cursor:pointer}
.pcard:hover{border-color:var(--core); background:var(--panel)}
.pcard:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.pcard.here{border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy)}
.pcard .pt{font-weight:800; color:var(--navy); font-size:14px}
.pcard .herepill{margin-left:6px; font-size:10.5px; background:var(--navy); color:#fff;
  border-radius:999px; padding:1px 7px; vertical-align:2px; font-weight:700}
.pcard .pw{font-size:12.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
.pcard .ap-bar{margin:7px 0 5px}
.pcard .pm{font-size:12.5px; margin-top:4px}
.pcard .pwho{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.6}

/* ── 底部 / 空狀態 / 載入中 ───────────────────────────── */
.bottom{display:flex; gap:9px; flex-wrap:wrap; margin:18px 0 0}
.empty{text-align:center; padding:52px 20px}
.empty h2{font-size:21px; color:var(--navy); margin:0 0 8px}
.empty p{color:var(--muted); margin:0 0 20px}
.loading{text-align:center; padding:52px 20px; color:var(--muted)}
.spin{display:inline-block; width:22px; height:22px; border:3px solid var(--line);
  border-top-color:var(--core); border-radius:50%; animation:sp .8s linear infinite; vertical-align:-5px; margin-right:9px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:640px){
  .wrap{padding:14px 16px 56px}
  .sec{padding:18px 20px}
  .alloc canvas{margin:0}
}
</style>
</head>
<body>
<div class="wrap">
  <nav id="apNav"></nav>
  <div id="apSteps"></div>
  <div id="resultRoot"><div class="loading"><span class="spin"></span>讀取你的計畫…</div></div>
</div>

<script src="../assets/engine.js"></script>
<script src="../assets/charts.js"></script>
<script src="../assets/state.js"></script>
<script src="../assets/shell.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const E=APEngine;
// 整頁由 JS 一次寫進 #resultRoot,所以名詞註解要等填完才掃(先掃會全部漏掉)。
APShell.init({page:'result', glossary:false});

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d)=>(v==null||!isFinite(v))?'—':(v*100).toFixed(d==null?0:d)+'%';
// 萬 → 億自動換算。與 /plan/ 的 fmtW、/report/ 的 wan 同口徑。
const wan=v=>{
  if(v==null||!isFinite(v))return '—';
  const a=Math.abs(v);
  if(a>=10000)return (v/10000).toFixed(2)+'億';
  return (a>=100?Math.round(v):Math.round(v*10)/10)+'萬';
};
/* 就地氣泡(S11-P9):把「這個數字是什麼意思」從正文搬到滑過才出現的地方。
   機制在 assets/shell.js 的 initGlossary —— .term 查全站辭典(名詞),
   .tip 掛一句就地白話(數字)。兩者外觀相同、共用同一顆氣泡。
   ⚠ 只在螢幕頁用;/report/ 是列印文件,一律不准把內容藏進氣泡。 */
const tip=(t,txt)=>`<span class="tip" tabindex="0" data-tip="${esc(t)}">${txt}</span>`;

const MECHNAME={both:'再平衡 ＋ 崩盤加碼',rebal:'只做再平衡',reserve:'只做崩盤加碼',
  deep3:'三段深觸發 −25/−35/−45(與「② 挑時機」同源)',
  orig:'深觸發原型(−25/−40)',bh:'買進持有,完全不動'};

/* ═══════════════════════════════════════════════════════════════════
   0. 有沒有計畫可看
   ═══════════════════════════════════════════════════════════════════ */
const st=APState.load();
let stored=false;
try{ stored=!!(localStorage.getItem(APState.KEY)||localStorage.getItem(APState.LEGACY_KEYS.plan)); }catch(e){}
// input.net 的預設值就是 50,所以「有沒有填過」不能只看它 —— 要先確認 localStorage 真的有東西。
const hasPlan=!!st.result || (stored && Number(st.input&&st.input.net)>0);

if(!hasPlan){
  // 沒有資料時不要顯示空的區塊或一堆「—」(docs/IA.md §5.3)。
  $('resultRoot').innerHTML=`<div class="empty">
    <h2>還沒有計畫。</h2>
    <p>回答九個白話問題,大約三分鐘,你就會在這一頁看到「你該做什麼」。</p>
    <p><a class="btn" href="../start/">開始(約 3 分鐘)　→</a></p>
    <p class="small mut" style="margin-top:22px">已經自己填過參數?到
      <a href="../plan/">⚙ 配資金</a>按一次「▶ 重新計算」,結果也會出現在這裡。</p>
  </div>`;
  return;
}

/* ═══════════════════════════════════════════════════════════════════
   1. 取得結果 —— 過期就自己重算
   docs/IA.md §6.2:這一頁的使用者不該「按了按鈕才看到自己的計畫」。
   用 isStale()(不確定就算過期)而不是 isProvablyStale():重算很便宜、
   使用者無感,寧可多算一次也不要顯示對不上設定的數字。
   ═══════════════════════════════════════════════════════════════════ */
function compute(){
  const ci=E.deriveOpts(APState.getInput(),{paths:1500});
  const sim=E.simulate(ci.w,ci.defs,ci.opts);
  const ms=E.milestones(sim,ci.opts,ci.fireNum);
  // buildResult 是引擎裡的純函式,/plan/ 按「▶ 重新計算」走的是同一個 —— 兩頁逐欄相同。
  APState.setResult(E.buildResult(ci,sim,ms));
  return APState.getResult();
}

function boot(){
  if(!APState.isStale()){ render(APState.getResult()); return; }
  $('resultRoot').innerHTML='<div class="loading"><span class="spin"></span>正在算你的計畫…(上千條市場路徑,約 2~3 秒)</div>';
  // 讓瀏覽器先把 loading 畫出來再進 1500 條路徑的迴圈,否則畫面會整個凍住。
  setTimeout(()=>{
    let R=null;
    try{ R=compute(); }catch(err){
      if(window.console)console.error(err);
      // 算不出來時要說人話並留一條出路 —— 不能只留一顆轉圈的圈圈。
      // (C5 落地後,非整數年齡已經在 deriveOpts 取整,引擎也改丟可讀的 RangeError;
      //  這個分支現在是最後一道防線,不是常見路徑。)
      $('resultRoot').innerHTML=`<div class="empty"><h2>算不出來 🙇</h2>
        <p class="small">你的設定裡有引擎處理不了的值。<br>
        到「⚙ 配資金」檢查 1.1 的年齡與退休年齡,再按一次「▶ 重新計算」。</p>
        <p><a class="btn" href="../plan/#basics">去改設定　→</a></p></div>`;
      return;
    }
    render(R);
  },30);
}

/* ═══════════════════════════════════════════════════════════════════
   2. 畫面
   ═══════════════════════════════════════════════════════════════════ */
let R=null,I=null,K=null,MS=null,W=null,WK=null;

function render(res){
  R=res; I=R.in; K=R.risk||{}; MS=R.ms||{}; W=R.w||{}; WK=Object.keys(W);
  const NAMES=(()=>{const d=E.assetDefs(I.carry,I.volDrag,I.ssoFin),m={};
    E.ORDER.forEach(k=>m[k]=d[k].name);return m;})();

  const net0=+I.net0||0, monthly=+I.mon||0;
  // 決議 D1:給使用者看的一律是**累積期**回撤(退休前),不是全期。
  // 全期回撤含「退休後照計畫把錢花掉」,預設配置下壞情境就是 −100% —— 那不是市場跌的。
  const ddP90=(K.ddAccumP90!=null)?K.ddAccumP90:null;
  const retired=(I.retire<=I.age0);            // 已屆退休 → 累積期是空的,引擎退回「前 36 個月」
  const ddLabel=retired?'進場後頭 3 年':'退休前';
  const worstLeft=(ddP90!=null)?net0*(1-ddP90):null;
  const hasLev=(W.L2||0)+(W.SSO||0)>1e-9;
  const mAge=MS.fireAge;

  let H='';

  /* ── 答案卡 ──────────────────────────────────────────
     手機上這一塊必須是第一屏 —— /timing/ 踩過這個坑(塌成單欄後行動指令被推到第二屏)。
     主答案=生活結果(lifeP50/lifeP10,見下方 S11-P7e 註解);pFire 降到 bandbox 展開器,
     fireAge 只留帶圖交叉點與深層說明 —— 兩者都當過主答案,演進理由見各分支註解。
     S11:最壞金額從這裡移出(行動條 + ② 各一次);印/調按鈕移到頁底(剛答完的人
     下一步是「讀」,不是「印」,底部本來就有同兩顆)。 */
  let heroK,heroV,heroSub,pfireHow='';
  /* S11-P7e:主角第三度換人(歲數→把握度→生活結果)。歲數與機率都是引擎的詞彙,
     使用者四輪回饋的共同點是「這對我的生活是什麼意思?」。答案卡改回答精靈
     自己問過的問題(cash 步驟:「退休以後,你想過什麼樣的生活?每月 __ 萬」):
     大字=中位情境過不過得到(lifeP50),副標=最不順十分之一縮到多少(lifeP10)
     +提領機制的代價;存不到/已達成/一般三種狀態統一同一版型,句型不再隨狀態跳動。
     存到目標把握(pFire)降到 bandbox 展開器;fireAge 只留在帶圖交叉點與深層說明。
     lifeP50 缺席(舊快照等罕見情況)時退回 P7c 的把握版型當 fallback。 */
  const mExp=I.exp/12;
  if(K.lifeP50!=null&&mExp>0){
    const flexLike=(I.wMode==='abw')||I.flexW;
    const p50m=mExp*K.lifeP50, p10m=(K.lifeP10!=null)?mExp*K.lifeP10:null;
    heroK=retired?`照這個做,你想過的「每月 ${wan(mExp)}」退休生活 —— 中位情境`
                 :`照這個做,${I.retire} 歲退休後,你想過的「每月 ${wan(mExp)}」生活 —— 中位情境`;
    heroV=K.lifeP50>=1.05?`過得到,還有餘裕`
         :(K.lifeP50>=0.95?`大致過得到`
         :`只過得到約 ${Math.max(1,Math.round(K.lifeP50*10))} 成`);
    /* S11-P9:這一段原本一口氣塞四個粗體、三個子句,是全站最長的一段常駐文字。
       砍成兩句 —— 中位過到什麼日子、最不順的十分之一縮到多少。
       提領機制的定義(攤銷式/彈性/固定)整段搬進氣泡,正文只留機制名字。
       原訂比例、資產未歸零都刪掉:兩者在下面「另外幾個數字」各有完整一列
       (IA §7.5 規則 5:同一個數字同頁最多出現兩次)。 */
    const wName=(I.wMode==='abw')?'攤銷式提領':(I.flexW?'彈性提領':'固定提領');
    const wTip=(I.wMode==='abw')?'每年拿剩下的資產重算今年能花多少。市場差就自動少花,數學上不會提早花光。'
      :(I.flexW?'壞年份自動少花一點(最低降到原訂的七成),換資產撐得更久。'
      :'不管市場好壞,每年都花一樣多。壞年份等於在最低點賣掉最多的股票。');
    heroSub=`中位情境每月實際約 <b>${wan(p50m)}</b>`
      +(K.legacyMed!=null?`,${I.maxAge} 歲還剩 ${wan(K.legacyMed)}`:'')+`。`
      +(p10m!=null?(flexLike
        ?`最不順的十分之一得縮到 <b>${wan(p10m)}／月</b> —— ${tip(wTip,wName)}會自動少花,錢不會歸零,縮的是日子。`
        :`最不順的十分之一只花得到原訂的 <b>${pct(K.lifeP10)}</b> —— ${tip(wTip,wName)}不會自動少花,壞情境是錢提早見底。`)
      :'');
  }else if(mAge==null){
    heroK=`照這個做,到 ${I.maxAge} 歲`;
    heroV=`還存不到目標`;
    // essOK 不在這裡重複 —— 它是下面「退休以後夠不夠」的大字頭條(§7.5 規則 5)。
    heroSub=`中位情境下,到 ${I.retire} 歲存夠目標的把握約 <b>${pct(K.pFire)}</b>。最有效的三個調整就寫在下面。`;
  }else if(mAge<=I.age0){
    heroK=`照這個做`;
    heroV=`現在就已達成目標`;
    heroSub=`以中位情境計,不是保證。下面是維持它的做法。`;
  }else{
    // S11-P7:不講「不用工作」—— fireAge 只是錢的里程碑,投入/提領全程按 retire 模擬
    // (SPEC §5.9「那個歲數從來沒有被模擬過」),且輸入欄位當時也叫「不用再為錢工作」,同句兩義。
    // S11-P7b:「錢到位」被讀成「完成了,不用再存」→ 改「存到目標」+安全邊際敘事。
    // S11-P7c(使用者三度回饋):mAge 早於 retire 時,那個歲數之後照樣要投入,拿它當
    // 主答案沒有行動意義 ——「幹嘛用這個年紀出來」—— 換動詞救不了,根因是拿錯數字。
    // 主角改成 pFire(存夠把握),mAge 降副標一句:認領帶圖交叉點+提早退休的行動出口。
    const early=mAge<I.retire, late=mAge>I.retire;
    heroK=`照這個做,到你設定的 ${I.retire} 歲退休,存夠目標的把握是`;
    heroV=`約 ${pct(K.pFire)}`;
    /* S11-P9:三個 .jargon 括號刪掉 —— 「中位」在這一段就會被 annotateTerms 標成氣泡,
       而深藍底上的氣泡樣式剛剛才補上(見本頁 .ap-hero .term)。
       「不是保證/1500 條」下沉到 #how-pfire;「改退休年齡再算一次」下沉到 #more-odds
       的說明框(那裡本來就有完整版) —— 兩者都不該擠在第一屏。 */
    heroSub=`「存夠」= 資產達到 ${wan(R.fireNum)}。`
      +(late?`中位情境要到 <b>${mAge} 歲</b>才碰得到,比你設定的晚 ${mAge-I.retire} 年 —— 想拉高把握:多投入、晚點退、或降開銷。`
        :(early?`中位情境 <b>${mAge} 歲</b>就會碰到目標,之後繼續投入的 ${I.retire-mAge} 年,才把把握從一半推到上面那個數字。`
          :`中位情境剛好在 ${I.retire} 歲碰到目標,所以把握大約就是一半。`));
  }
  /* S11-P7d:光溜溜的 62% 會被拿「考試 62 分」的直覺讀(使用者回饋「看起來就很擔心」)。
     展開器給錨點、不發明及格線:50%=中位剛好準時;沒趕上多半只是晚幾年(fireNum 內建
     兩層保守);網路上講的 75~90% 目標帶是給 essOK 這類「撐不撐得住」指標用的。
     放 bandbox 裡(白底)—— details.x 的字色在深色 hero 上會看不見。已達成分支不顯示。 */
  if(K.pFire!=null && !(mAge!=null&&mAge<=I.age0)){
    pfireHow=`<details class="x how" data-remember id="how-pfire"><summary>這個數字沒有及格線 —— 50% 就是「準時達標」</summary>
      <div class="body">
        <p><b>50%</b> = 中位情境剛好在 ${I.retire} 歲碰到目標 ${wan(R.fireNum)},也就是圖上那條水平虛線。
          高過一半是提早碰到的安全邊際,低於一半代表連中位都會遲到。</p>
        <p>沒趕上的 ${pct(1-K.pFire)} 多半不是歸零,是<b>晚幾年才到</b>或退休後略減支出。
          目標金額本身已經很保守:提領率用「永遠不動本金」的口徑,計畫又一路算到 ${I.maxAge} 歲。</p>
        <p class="mut">常聽到的「把握度要 75%~90%」講的是另一種指標 ——
          退休後撐不撐得住,也就是下面那個大數字${K.essOK!=null?`(你的是 ${pct(K.essOK)})`:''}。
          這一個超過 90%,通常代表存得比需要多。</p>
      </div></details>`;
  }
  /* S11-P7(Q3):一次性大額支出(買房頭期)在帶圖上是一個沒有名字的凹口 ——
     「錢留在市場、到期才賣」是刻意設計(/start/ 第 3 題有揭露),圖旁要認領它,
     並把「買房前夕遇到大跌」的風險講明。沒有一次性支出的人看不到這行。 */
  const onceFlows=E.parseFlows((APState.getInput()||{}).flows||'')
    .filter(f=>f.kind==='exp'&&f.e==='once'&&typeof f.s==='number'&&f.s>I.age0);
  const onceNote=onceFlows.length?`<p class="mut small" style="margin:6px 0 0">`
    +onceFlows.map(f=>`圖上 ${f.s} 歲那個往下的缺口=「${esc(f.n)} ${f.amt} 萬」`).join(';')
    +`:這筆錢留在投資裡跟著漲跌,到時候才賣掉支付 —— 那之前若遇到大跌,可能得延後或調整預算。</p>`:'';

  H+=`<div class="ap-hero">
    <div class="k">${heroK}</div>
    <div class="v">${heroV}</div>
    <p class="sub" style="margin-top:6px">${heroSub}</p>
    <div class="bandbox" id="bandBox">
      <div class="ap-chart"><canvas id="bandCv" height="190"></canvas></div>
      <div class="ap-probe" id="bandProbe"></div>
      ${onceNote}
      <details class="x how" data-remember id="how-band"><summary>三條線是上千次模擬的範圍,不是三條真實走勢</summary>
        <div class="body">
          <p>一半的情境落在「普通情境」上下,每 10 種情境有 1 種比「壞情境」更差。
            <b>真實世界只會走出其中一條</b>,而且多半不會貼著任何一條線走。</p>
          <p class="mut">水平虛線是目標金額,直虛線是退休年齡。
            <b>退休線之後已經含每月提領</b>,所以「剛退休就崩盤」的壞運氣也算在內。金額都已扣掉通膨。</p>
          <p class="mut">縱軸是對數刻度,<b>畫不出 0</b> —— 歸零的路徑會貼著圖的下緣走,
            別拿這張圖目測破產率。精確數字看下面的「資產未歸零」與「必要支出全程撐得住」。</p>
        </div>
      </details>
      ${pfireHow}
    </div>
  </div>`;

  if(mAge==null){
    H+=`<div class="note warn"><b>還差一段。</b>最有效的三個調整依序是:提高每月投入、延後退休年齡、降低退休後年支出。
      加槓桿不是首選,它把跌幅一起放大。到「⚙ 配資金」改一格再按「▶ 重新計算」就能試。</div>`;
  }

  /* ── 三件事行動條(兼頁內目錄)──────────────────────────
     hero 回答「結果」(幾歲自由),這一條回答「行動」(現在做什麼)。
     每格都是連結,點了跳到對應段落 —— 結構本身承載資訊。 */
  let crashCell;
  const hasReserve=E.mechHasReserve(I.mech) && (W.CASH||0)>1e-9 && hasLev;
  const bands=E.mechBands(I.mech);
  if(hasReserve){
    crashCell=`<span class="k">跌到就加碼</span><span class="v">−${Math.abs(bands.THR[0]*100).toFixed(0)}%<small> 起</small></span>`;
  }else if(I.mech==='bh'){
    crashCell=`<span class="k">跌下來的時候</span><span class="v">什麼都不做</span>`;
  }else{
    crashCell=`<span class="k">跌下來的時候</span><span class="v">不加碼</span>`;
  }
  // id=actionRow:整條跳過名詞註解 —— <a> 裡塞 .term 按鈕是「連結包按鈕」的
  // 無效巢狀,點名詞會跟著跳頁;預覽格的字要自己白話,不靠氣泡。
  H+=`<div class="ap-statrow" id="actionRow">
    <a href="#sec-monthly"><span class="ap-stat">
      ${monthly>0?`<span class="k">每月投入</span><span class="v">${wan(monthly)}</span>`
                 :`<span class="k">每月要做的</span><span class="v">看一眼就好</span>`}
    </span></a>
    <a href="#sec-crash"><span class="ap-stat">${crashCell}</span></a>
    ${ddP90!=null?`<a href="#sec-worst"><span class="ap-stat warn">
      <span class="k">最壞一度剩</span><span class="v">${wan(worstLeft)}</span>
    </span></a>`:''}
  </div>`;

  // 有名詞氣泡的頁面就要有這個提示 —— 使用者測試顯示沒有人會自己發現虛線＋問號代表可點,
  // 少了它整份辭典等於白做(docs/HANDOFF.md「三樣不准弄丟的東西」第 3 項)。
  H+=`<div class="termhint">💡 這頁凡是<span class="fakedot">有虛線的字</span>都可以點開看白話解釋,不懂的名詞先點一下再往下讀。</div>`;

  /* ══ ① 現在該做什麼(原 ❷❸❹,內容完整保留)═══════════════ */
  H+=`<div class="sec" id="sec-do"><h2><span class="n">①</span>現在該做什麼</h2>`;

  /* ── 錢怎麼分 ────────────────────────────────────────── */
  const ne=+R.netExp||0;
  H+=`<div class="sub-h" id="sec-alloc">錢怎麼分</div>
    <div class="alloc">
      <canvas id="pie" width="296" height="296" aria-hidden="true"></canvas>
      <div class="tbl">
        <table><thead><tr><th>標的</th><th class="n">比重</th><th class="n">金額</th></tr></thead><tbody>`
    +WK.map(k=>`<tr><td><span class="sw" style="background:${E.ASSET_COLOR[k]||'#888'}"></span>${esc(NAMES[k]||k)}</td>
      <td class="n">${pct(W[k])}</td><td class="n">${wan(net0*W[k])}</td></tr>`).join('')
    +`</tbody><tfoot><tr><th>合計</th><th class="n">100%</th><th class="n">${wan(net0)}</th></tr></tfoot></table>
      </div>
    </div>
    <div class="oneline">大盤動 1 元,你這份錢會動 <b>${ne.toFixed(2)}</b> 元
      <span class="jargon">(術語:淨曝險 ${pct(ne)})</span></div>`;

  /* ▸ #why-alloc
     S8:改讀 ap_state_v2.ladder(九階風險階梯的落點)。舊的 wizard 記錄
     (S3 的 {tier:'穩健'})由 APState.getLadder() 自動讀成 rung:null 的相容形式。 */
  const lad=APState.getLadder();
  const curRung=lad&&lad.rung!=null?E.LADDER_BY_RUNG[lad.rung]:null;
  H+=`<details class="x" id="why-alloc" data-remember><summary>決定結果的是淨曝險,不是你買了幾檔`
    +(curRung?`(第 ${lad.rung} 階:${esc(curRung.name)})`
      :(lad&&lad.tier?`(舊版測驗:${esc(lad.tier)}型)`:``))
    +`</summary><div class="body">`;
  if(curRung){
    H+=`<p>你在「🚀 快速開始」最後一題選的是<b>第 ${lad.rung} 階「${esc(curRung.name)}」</b>
      (${lad.market==='TW'?'台股為主':(lad.market==='US'?'美股(全球)為主':'兩邊都要')}${
        // levMkt 只會出現在 S10 以前的存檔(那時槓桿階沒有 BOTH,要另外挑一邊)。
        // 對那些記錄它仍然是正確的描述,所以照印;新記錄不再寫入這個欄位。
        lad.levMkt?`,槓桿押${lad.levMkt==='TW'?'台股':'美股'}`:''})。</p>`;
    if(lad.suggested!=null&&lad.suggested!==lad.rung){
      H+=`<p class="mut">問卷依你的答案建議的是第 <b>${lad.suggested}</b> 階
        ${lad.binding&&lad.binding.length?`(綁住你的是:${lad.binding.map(esc).join('、')})`:''} ——
        <b>你選了第 ${lad.rung} 階</b>,那是你自己的決定。</p>`;
    }else if(lad.binding&&lad.binding.length){
      H+=`<p class="mut">問卷取三項條件<b>最嚴格</b>的那一項(不是平均):
        目前綁住你的是 <b>${lad.binding.map(esc).join('、')}</b>。</p>`;
    }
    if(lad.foundNote)H+=`<p class="mut">另外:${esc(lad.foundNote)} → 再降一階。</p>`;
  }else if(lad&&lad.tier){
    H+=`<p>這份配置來自<b>舊版</b>的三檔風險測驗(${esc(lad.tier)}型)。
      現在的風險等級改成九階的梯子 —— 重跑一次「🚀 快速開始」就會對應到新的階。</p>`;
  }
  H+=`<p>把每個標的的比重乘上倍率再加總:正二/SSO 算 2,現金與債券算 0,其餘算 1。
      你的是 <b>${pct(ne)}</b> ——
      ${ne>1.5?'超過 150%,是積極槓桿。':(ne>1.2?'120~150%,是溫和槓桿。':(ne>=0.9?'約等於把錢全押大盤。':'低於 90%,比全押大盤更緩和。'))}</p>
    <p class="mut">它量的是跟著市場動的部分,不是總風險 —— 債券自己的利率風險不在裡面,那份由回撤數字負責。</p>
    <p class="mut">混合名目年化假設 ${pct(R.muNom,1)}<span class="src fixed">假設值</span>、通膨 ${pct(I.infl,1)}。這是前瞻假設,不是預測。</p>
    </div></details>`;

  // ▸ #switch-tier(統一風險階梯,資料來自 assets/engine.js 的 E.LADDER)
  H+=`<details class="x" id="switch-tier" data-remember><summary>九階全部攤開,最壞跌幅都先寫在上面</summary>
    <div class="body">
      <p>點一階就會<b>換掉投資組合與策略</b>並立刻重算。你的年齡、資產、每月投入<b>不會被改</b>。</p>
      <div class="famtoggle" id="famToggle">
        <button type="button" data-fam="TW">🇹🇼 純台股(免複委託)</button>
        <button type="button" data-fam="US">🌐 美股 / 全球(需複委託)</button>
        <button type="button" data-fam="BOTH">🌍 兩邊都要(各一半)</button>
      </div>
      <div class="pcards" id="tierCards"></div>
      <p class="small mut" style="margin-top:8px">「最壞」= 4000 次模擬裡第 90 差的那一次,退休前的最深帳面跌幅<span class="src fixed">回測值</span>。
        <b>連最保守的一階都約 −10%,沒有零回撤的股票組合。</b><br>
        第 6 階以上要開槓桿,那幾階的執行細節在 <a href="../timing/">「② 挑時機」</a>。</p>
    </div></details>`;

  /* ── 每個月做什麼 ────────────────────────────────────── */
  H+=`<div class="sub-h" id="sec-monthly">每個月做什麼</div>`;
  if(monthly>0){
    H+=`<div class="ap-stat"><span class="k">每月投入</span><span class="v">${wan(monthly)}</span></div>
      <div class="chips">${WK.map(k=>`<span class="chip">${esc(E.SHORT[k]||k)} ${wan(monthly*W[k])}</span>`).join('')}</div>
      <p class="small mut">金額不必抓剛好,零股湊個整數就行;<b>持續比精準重要得多</b>。
        每月投入本身就有再平衡效果 —— 它是按目標比重買的,會自動把跌多的那格補回來。</p>`;
  }else{
    H+=`<p class="lead">你設定為<b>不再新增投入</b>。既有部位照下面的規則維護就好。</p>`;
  }
  if(I.dcaMonths>0){
    H+=`<div class="note">現有資金<b>分 ${I.dcaMonths} 個月</b>投入(每月一筆,約 ${wan(net0/I.dcaMonths)}/月),不是一次全壓。
      <b>現金準備金第一天就到位、不分批</b> —— 它的用途是崩盤時有彈藥,晚到就沒意義了。</div>`;
  }
  H+=`<details class="x" id="why-rebal" data-remember><summary>有做差很多,做多勤沒差 —— 偏離 50% 才動</summary>
    <div class="body">
      <p>再平衡就是定期把配置拉回目標:賣掉漲多的、補買跌多的。
        實測 50% 正二 + 50% 現金、30 年<span class="src fixed">回測值</span>:</p>
      <ul>
        <li><b>有做差很多</b>:完全不動,槓桿部位長期壓過現金 → 回撤 69%;有再平衡 → 回撤降到 <b>56%</b>。</li>
        <li><b>做多勤沒差</b>:偏離 50% 才拉回(30 年約 4 次)vs 每月都拉回(360 次),結果幾乎一樣 ——
          加上手續費與稅,勤做反而更差。</li>
      </ul>
      <p><b>規則:每月看一眼,任一標的偏離目標超過 50% 才全部拉回</b>(例如目標 30%、變成 45% 或 15%)。沒超過就不要動。</p>
    </div></details>`;

  /* ── 跌下來的時候做什麼 ──────────────────────────────── */
  // 「會不會加碼」的判斷收在引擎(E.mechHasReserve)—— 這一份漏掉 deep3 的話,
  // 選槓桿階的人會看到「跌的時候不加碼」,而那正是那幾階的核心。
  H+=`<div class="sub-h" id="sec-crash">跌下來的時候做什麼<span class="tag">${esc(MECHNAME[I.mech]||I.mech)}</span></div>`;
  if(hasReserve){

     ② 四組共用同一顆 seed(common random numbers)。只改 annualContrib/sched、
        不動權重 → active 不變 → 每月抽取次數相同 → 隨機序列逐位元對齊,
        所以階梯數學上保證單調,不會出現「多投反而更差」的雜訊假象(SPEC §152-154)。
     ③ 刻意不加 data-remember:shell.js 會把記住的展開器在載入時還原成 open,
        那會讓回訪者一進這頁就被多跑四組模擬。改成只在主動展開時才算。 */
  const ladderOK = (+I.mon>0) && (I.retire-I.age0>=9);
  if(ladderOK){
    const cAge=MS.coastAge;
    const sumTxt = (cAge!=null&&cAge<=I.age0)
      ? `你其實<b>現在就可以停止投入</b>了 —— 展開看代價`
      : ((cAge!=null&&cAge<=I.retire)
        ? `<b>${cAge} 歲</b>起就可以停止投入 —— 展開看代價`
        : `提早停止投入會怎樣?`);
    H+=`<details class="x" id="coast-ladder"><summary>${sumTxt}(要另外跑 4 組模擬,約 3~5 秒)</summary>
      <div class="body">
        <p>每一列都是<b>一整份重新跑過的計畫</b>:投入到那個歲數就停,但退休年齡仍然是 ${I.retire} 歲。
          省下來的錢是還給現在的自己的,代價寫在右邊。</p>
        <div id="ladderBox"></div>
      </div></details>`;
  }
  H+=`</div>`;

  /* ── 先確認地基 ──────────────────────────────────────── */
  const F=APState.getFounding()||{};
  const FQ=[['chk1','我有至少 <b>6 個月生活費</b>的緊急預備金,而且放在這套投資之外'],
            ['chk2','我有基本的<b>醫療／失能／壽險</b>保障'],
            ['chk3','我<b>沒有</b>卡債、信貸這類高利率負債<span class="mut">(一般房貸不算)</span>'],
            ['chk4','我用的是<b>閒錢</b>——就算一度腰斬、好幾年回不來,也不會影響生活']];
  H+=`<div class="sec"><h2 class="minor">先確認地基</h2>
    <p class="lead">這一步不用任何工具,但比上面每一步都重要。地基沒打好之前,遇到意外會被迫在最低點賣股票。</p>`
    +FQ.map(q=>`<label class="chk"><input type="checkbox" data-fk="${q[0]}"${F[q[0]]?' checked':''}>${q[1]}</label>`).join('')
    +`<div id="foundMsg"></div></div>`;

  /* ── 底部 ────────────────────────────────────────────── */
  H+=`<div class="bottom">
    <a class="btn" href="../report/">🖨 印成計劃書</a>
    <a class="btn ghost" href="../plan/#portfolio">⚙ 想自己調參數　→</a>
    <a class="btn ghost" href="../timing/">📈 看今天該做什麼</a>
  </div>
  <p class="small mut" style="margin-top:12px">結果產生於 ${esc(R.updated||'')}
    ${I.engine==='hist'?'(引擎:歷史重抽)':''}。這份計畫只存在你自己的瀏覽器裡,沒有傳到任何伺服器。</p>`;

  $('resultRoot').innerHTML=H;

  // 填完才掃名詞,並讓「看細節」記住收合狀態。
  // actionRow 用 dynIds 跳過(它不是動態容器,但機制相同:這個容器不要進氣泡)。
  try{ APShell.annotateTerms($('resultRoot'),{dynIds:{actionRow:1}}); }catch(e){ if(window.console)console.warn(e); }
  try{ APShell.initAdv(); }catch(e){}

  drawPie(net0);
  drawBand();
  bindTierCards();
  bindFounding();
  bindLadder();
  loadToday(bands, hasReserve);
}

/* ── 停投階梯:只在主動展開時才算 ──────────────────────────
   四組模擬 ≈ 3~5 秒(桌機),所以逐列漸進渲染 —— 使用者約 1 秒就看到第一列,
   而不是呆等一片空白(照抄 /plan/ 的 setTimeout(step,0) 讓出主執行緒的做法)。
   算過就快取在 _ladderDone,重複收合展開不重算。 */
let _ladderDone=false;
function bindLadder(){
  const d=$('coast-ladder'); if(!d)return;
  d.addEventListener('toggle',()=>{ if(d.open&&!_ladderDone)runLadder(); });
}
function runLadder(){
  const box=$('ladderBox'); if(!box)return;
  _ladderDone=true;
  box.innerHTML='<div class="loading"><span class="spin"></span>跑第 1 / 4 組模擬…</div>';
  const PATHS=400;
  // 同一顆 seed = common random numbers。用 inputHash 讓「同一份設定永遠得到同一批路徑」,
  // 換了設定才重抽 —— 使用者反覆展開看到的數字不會跳。
  const SEED=(APState.inputHash?APState.inputHash(APState.getInput()):'coast-ladder');
  const ci=E.deriveOpts(APState.getInput(),{paths:PATHS});
  const n=ci.retire-ci.age0;
  const stops=[ci.age0, ci.age0+Math.round(n/3), ci.age0+Math.round(2*n/3), ci.retire];
  const rows=[];
  const step=()=>{
    const i=rows.length;
    if(i>=stops.length){ paint(true); return; }
    try{
      const stop=stops[i];
      const fl=(ci.flows||[]).slice();
      // 數字終點 = 該歲生日的前一個月(engine.js:451),正是「投到剛滿 N 歲、從 N 歲起停」。
      // stop<=age0 時整條流無效(s>e),等於完全不投 —— 那也正是要的語意。
      if(stop>ci.age0)fl.push({n:'投入',amt:ci.mon*12,freq:'y',kind:'inc',cat:'ess',real:1,s:'now',e:stop});
      const sc=E.buildFlowSchedule(fl,{age0:ci.age0,retire:ci.retire,maxAge:ci.maxAge,
                                       infl:ci.infl,exp:ci.exp,pension:ci.pension});
      // 必須「取代」不能「疊加」:annualContrib 留著再加流,essOK 的 pool 會憑空多一份而灌水。
      // ci.annualContrib 與 ci.opts.annualContrib 是兩個獨立欄位,兩邊都要歸零。
      const optsC=Object.assign({},ci.opts,{annualContrib:0,sched:sc,seed:SEED});
      const ciC=Object.assign({},ci,{annualContrib:0,sched:sc,opts:optsC});
      const sim=E.simulate(ciC.w,ciC.defs,optsC);
      const RR=E.buildResult(ciC,sim,E.milestones(sim,optsC,ciC.fireNum));
      rows.push({stop, saved:ci.mon*12*(ci.retire-stop), pFire:RR.risk.pFire, med:RR.risk.medRetire});
    }catch(err){
      if(window.console)console.warn(err);
      box.innerHTML='<p class="mut">這一段算不出來(設定可能有異常的值)。其餘結果不受影響。</p>';
      return;
    }
    paint(false);
    setTimeout(step,0);   // 讓出主執行緒,讓剛算好的那一列先畫出來
  };
  const paint=(done)=>{
    box.innerHTML=`<table><thead><tr><th>投入到幾歲為止</th><th class="n">省下的投入</th>
        <th class="n">${tip(E.RISK_META.pFire.hint,E.RISK_META.pFire.label)}</th><th class="n">退休時中位</th></tr></thead><tbody>`
      +rows.map(r=>`<tr><td>${r.stop<=ci.age0?`現在(${r.stop} 歲)`:(r.stop>=ci.retire?`做完(${r.stop} 歲)`:`${r.stop} 歲`)}</td>
        <td class="n">${r.saved>0?wan(r.saved):'—'}</td>
        <td class="n"><b>${pct(r.pFire)}</b></td>
        <td class="n">${wan(r.med)}</td></tr>`).join('')
      +`</tbody></table>`
      +(done?note():`<div class="loading" style="padding:14px"><span class="spin"></span>跑第 ${rows.length+1} / ${stops.length} 組模擬…</div>`);
  };
  const note=()=>{
    const first=rows[0], last=rows[rows.length-1];
    // coastAge 是 null 的人(中位到退休都碰不到目標)沒有 Coast 可以戳破 —— 那句話會沒有對象。
    const hasCoast=(MS.coastAge!=null);
    return `<p class="mut small">四組<b>共用同一批市場路徑</b>,所以差異純粹來自「投多久」,不夾雜運氣。
      用 ${PATHS} 條路徑(頭條用 1500),與頭條的把握度可能差一兩個百分點。</p>`
      +(hasCoast
        ? `<div class="note warn"><b>順帶戳破一件事:Coast FIRE 那個歲數比它聽起來的樂觀。</b>
            它是拿目標金額用固定報酬率直線折現回推的,沒有波動、沒有壞情境。
            真的跑模擬,現在停手只有 <b>${pct(first.pFire)}</b>,做完是 <b>${pct(last.pFire)}</b> ——
            Coast 說的「夠了」,其實是「中間情境剛好夠」。
            要不要拿那些年的投入換提早收手是你的取捨,但它有代價。</div>`
        : `<div class="note"><b>你目前還沒到 Coast</b> —— 中位情境一路到 ${I.retire} 歲都碰不到目標,
            所以提早停投一定更差。這張表現在的用途,是看清「每少投一段,把握度掉多少」。</div>`);
  };
  setTimeout(step,30);   // 讓 spinner 先畫出來再進迴圈
}

/* ── 錢怎麼分:圓餅(共用 APCharts.donut)──────────────────
   顏色來自 E.ASSET_COLOR(全站同一份,已通過白底 3:1 與相鄰色盲分離驗證)。
   圖例在旁邊的表格裡,所以圓餅本身不寫字 —— 小螢幕上字會疊在一起。 */
function drawPie(net0){
  const cv=$('pie'); if(!cv||!window.APCharts)return;
  APCharts.donut(cv, E.ORDER.map(k=>({key:k, value:W[k]||0, color:E.ASSET_COLOR[k]||'#888'})));
}

/* ── 答案卡:資產成長機率帶(共用 APCharts.band)────────────
   band 資料在 result.band(engine buildResult 算好、隨結果持久化)。
   舊存檔沒有 band → 整塊收起來,不畫「—」。 */
function drawBand(){
  const cv=$('bandCv'); if(!cv)return;
  const ok=!!(window.APCharts&&R.band&&APCharts.band(cv,R.band,{
    retireAge:I.retire, target:R.fireNum, fmt:wan, probe:$('bandProbe'),
  }));
  if(!ok){ const bx=$('bandBox'); if(bx)bx.style.display='none'; }
}

/* ── 換一個風險等級(統一風險階梯,S8)──────────────────────
   資料本體是 E.LADDER 的九階,分水嶺以上是槓桿階、要多一段警語。
   S11:每張卡加回撤比例條;確認從 window.confirm 改成行內 .ap-confirm
   (瀏覽器原生對話框擋全頁、不能帶格式、鍵盤路徑差)。 */
let navFam='TW';
function bindTierCards(){
  const host=$('tierCards'); if(!host)return;
  /* 目前的市場家族當預設分頁。改版前只在 TW / US 之間二選一 ——
     於是選了「兩邊都要」的人一進來看到的是純台股那一組,跟他自己的計畫對不上。
     S10 起 BOTH 是完整的一組(九階裡八階都有,只缺被支配的第 6 階),所以三選一。 */
  const usW=(W.VT||0)+(W.VTI||0)+(W.VOO||0)+(W.QQQ||0)+(W.SSO||0);
  const twW=(W.TW50||0)+(W.L2||0);
  navFam=(usW>1e-9&&twW>1e-9)?'BOTH':(usW>twW?'US':'TW');
  const lad=APState.getLadder();
  const paint=()=>{
    document.querySelectorAll('#famToggle button').forEach(b=>b.classList.toggle('active',b.dataset.fam===navFam));
    host.innerHTML='';
    E.ladderRungs(navFam).forEach(L=>{
      const wf=E.ladderWeights(L.rung,navFam);
      const wp={}; E.ORDER.forEach(k=>wp[k]=wf[k]/100);
      const ne=E.netExposure(wp), dd=L.dd[navFam];
      const left=(+R.in.net0||0)*(1-dd);
      const isHere=!!(lad&&lad.rung===L.rung&&lad.market===navFam);
      const div=document.createElement('div');
      div.className='pcard'+(isHere?' here':'');
      div.tabIndex=0;
      div.setAttribute('role','button');
      div.innerHTML=`<div class="pt">${L.emoji} ${L.rung}. ${esc(L.name)}${isHere?'<span class="herepill">目前</span>':''}</div>`
        +`<div class="pw">${E.ORDER.filter(k=>wf[k]).map(k=>E.SHORT[k]+' '+wf[k]+'%').join(' · ')}</div>`
        // 比例條:藍=谷底還在的,橘=一度少掉的 —— 與「② 最壞會有多壞」同一套視覺語言。
        +`<div class="ap-bar thin" aria-hidden="true"><i style="width:${Math.max(2,(1-dd)*100)}%"></i><i class="loss" style="width:${Math.max(2,dd*100)}%"></i></div>`
        +`<div class="pm">最壞一度只剩 <b style="color:var(--bad)">${wan(left)}</b>
           <span class="mut">(−${(dd*100).toFixed(0)}%)</span><span class="src fixed">回測值</span></div>`
        // 年化要標「名目/實質」—— LADDER[].mu 是名目(calibrate_wizard.js 用 impliedCAGR + infl),
        // 而這張卡片改版前只印「年化 8.6%」,讀者無從判斷有沒有扣通膨。實質 = mu − infl(C9 的減法慣例)。
        // 這裡在 bindTierCards() 裡,沒有 render() 那個區域變數 I,所以走 R.in。
        +`<div class="pwho">淨曝險 ${(ne*100).toFixed(0)}% · 年化 名目 ${(L.mu[navFam]*100).toFixed(1)}%／實質 ${((L.mu[navFam]-(+R.in.infl||0))*100).toFixed(1)}% · ${esc(L.when)}</div>`;
      const open=e=>{
        if(e&&e.target&&e.target.closest&&e.target.closest('.ap-confirm'))return;
        askRung(div,L,navFam);
      };
      div.addEventListener('click',open);
      div.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(e); }
      });
      host.appendChild(div);
    });
  };
  document.querySelectorAll('#famToggle button').forEach(b=>b.addEventListener('click',()=>{navFam=b.dataset.fam;paint();}));
  paint();
}

/* 行內確認:插在被點的那張卡裡,同時間只開一個。
   Esc 或「先不要」→ 關閉並把焦點還給卡片;確認 → applyRung(狀態寫入不變)。 */
function askRung(card,L,mkt){
  const host=$('tierCards');
  Array.prototype.forEach.call(host.querySelectorAll('.ap-confirm'),n=>n.remove());
  const dd=L.dd[mkt], left=(+R.in.net0||0)*(1-dd);
  // 槓桿階多問一次,而且把最壞金額寫在確認框裡 —— 跨過分水嶺不該是一次順手的點擊。
  const extra=L.lev
    ? `<br>⚠ 這是<b>槓桿階</b>(淨曝險 ${Math.round(E.netExposure((()=>{const o={};E.ORDER.forEach(k=>o[k]=E.ladderWeights(L.rung,mkt)[k]/100);return o;})())*100)}%)。
       最壞情況你的 ${wan(+R.in.net0||0)} 會一度只剩 <b>${wan(left)}</b>。<b>真的碰到那一天,你賣不賣?</b>`
    : '';
  const box=document.createElement('div');
  box.className='ap-confirm';
  box.setAttribute('role','group');
  box.setAttribute('aria-label','確認換風險等級');
  box.innerHTML=`要把配置換成「${L.emoji} 第 ${L.rung} 階 ${esc(L.name)}」嗎?<br>
    只會換掉投資組合與策略,你的年齡、資產、每月投入<b>不會被改</b>。${extra}
    <div class="acts">
      <button type="button" class="btn" data-go="1">換成第 ${L.rung} 階</button>
      <button type="button" class="btn ghost" data-no="1">先不要</button>
    </div>`;
  card.appendChild(box);
  const close=()=>{ box.remove(); try{card.focus();}catch(e){} };
  box.querySelector('[data-no]').addEventListener('click',e=>{ e.stopPropagation(); close(); });
  box.querySelector('[data-go]').addEventListener('click',e=>{ e.stopPropagation(); applyRung(L,mkt); });
  box.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } });
  box.querySelector('[data-go]').focus();
}
function applyRung(L,mkt){
  const raw=E.ladderWeights(L.rung,mkt), w={};
  E.ORDER.forEach(k=>w[k]=(raw[k]||0)/100);
  APState.setInput(Object.assign({}, APState.getInput(), {
    mech:L.mech, glide:L.glide, glideStart:L.glideStart, flexW:L.flexW,
    dcaMonths:L.dca, swr:L.swr/100, w
  }));
  // 階梯落點也要跟著改,否則 #why-alloc 會繼續講上一階的理由。
  const prev=APState.getLadder()||{};
  APState.setLadder(Object.assign({}, prev, {
    // levMkt 於 S10 移除(槓桿階三個市場都有權重了)。舊記錄留著無害,只是不再寫入。
    rung:L.rung, source:'manual', market:mkt,
  }));
  window.scrollTo(0,0);
  boot();   // 輸入變了 → isStale() 為真 → 自己重算
}

/* ── 地基自測 ───────────────────────────────────────────
   這是這一頁唯一的輸入元件(docs/IA.md §5.3 設計約束 4 的例外)——
   它是自我確認,不是模擬參數,所以不會讓結果過期。 */
function bindFounding(){
  const boxes=Array.prototype.slice.call($('resultRoot').querySelectorAll('input[data-fk]'));
  if(!boxes.length)return;
  const paint=()=>{
    const miss=boxes.filter(b=>!b.checked).length;
    const m=$('foundMsg'); if(!m)return;
    if(miss===0){ m.style.color='var(--good)';
      m.textContent='✓ 地基 4/4,可以執行上面的計畫。每年重看一次就好。'; }
    else{ m.style.color='var(--warn-ink)';
      m.textContent='還有 '+miss+' 項沒打勾 —— 建議先補起來再執行上面的配置,尤其不要開槓桿。'; }
  };
  const save=()=>{
    const s={}; boxes.forEach(b=>s[b.dataset.fk]=b.checked);
    try{ APState.setFounding(s); }catch(e){}
    paint();
    try{ APShell.renderSteps('result'); }catch(e){}
  };
  boxes.forEach(b=>b.addEventListener('change',save));
  paint();
}

/* ── 今天的水位(來自 ② 挑時機的 data.json)─────────────
   抓不到就整段不顯示,不要顯示「—」(docs/IA.md §5.3 設計約束 3)。
   ⚠ 這裡只借用「加權指數自高點回撤」這個市場事實。
   ② 挑時機自己的分批水位是另一套(−25/−35/−45,針對單一台股槓桿部位),
   **兩套規則不能混著讀**,所以刻意不顯示它的「已觸發 N 批」。 */
function loadToday(bands, hasReserve){
  const box=$('todayBox'); if(!box)return;
  fetch('../timing/data.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!d.reserve||!d.taiex)return;
    const rv=d.reserve, dd=(+rv.curDd||0)/100;   // curDd 是 %,轉成小數
    let hit='';
    if(hasReserve){
      const n=bands.THR.filter(lv=>dd<=lv).length;
      hit=n>0
        ? `照上面的表,這個深度已經越過<b>第 ${n} 格(−${Math.abs(bands.THR[n-1]*100).toFixed(0)}%)</b>。`
        : `還沒到你的第 1 格(−${Math.abs(bands.THR[0]*100).toFixed(0)}%),<b>今天不必做任何事</b>。`;
    }else{
      hit=`你的計畫沒有加碼水位,<b>今天不必因為這個數字做任何事</b>。`;
    }
    box.innerHTML=`<div class="note"><b>今天的水位</b><span class="src live">每日更新</span><br>
      加權指數 <b>${Math.round(d.taiex.close).toLocaleString('zh-TW')}</b>(${esc(d.taiex.date)}),
      自 ${esc(rv.athDate)} 的高點 ${Math.round(rv.ath).toLocaleString('zh-TW')} 回撤
      <b>−${Math.abs(+rv.curDd||0).toFixed(1)}%</b>。${hit}
      <div class="small mut" style="margin-top:6px">⚠ 這是<b>台股加權指數</b>的回撤,不是你整個帳戶的 —— 只讓你知道大概到哪了。
        「② 挑時機」用的是另一套水位,<b>不要跟上面的表混著讀</b>。</div>
      <div style="margin-top:9px"><a class="btn ghost" href="../timing/">看今天該做什麼　→</a></div></div>`;
  }).catch(()=>{});
}

boot();
})();
</script>
