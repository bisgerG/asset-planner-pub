name: update-data

on:
  schedule:
    # 多排幾個時段，哪個先跑到、先抓到新資料就先更新；之後的執行若資料沒變會
    # 顯示「無變更，略過 commit」，不會產生多餘的 commit。
    # 原因：GitHub 排程佇列實測會讓實際執行比預定晚 5~10 小時（只排 10:30 UTC 時，
    # 實際常落在 UTC 16:00~20:00 = 台灣隔天凌晨），所以提前並分散時段增加機會。
    # 刻意壓在整點之後：整點是排程尖峰，常態會再延遲 5~30 分鐘。
    # 證交所收盤 13:30，但 FMTQIK 含盤後定價與鉅額交易，實際公布時間未驗證；
    # 若跑得太早抓不到新的一天，就只是維持舊資料，等後面的時段補上。
    - cron: '30 7 * * 1-5'    # 台灣 15:30
    - cron: '30 9 * * 1-5'    # 台灣 17:30
    # 週一～週六：原本的 18:30 保底；週六那次是為了補抓週五收盤。
    - cron: '30 10 * * 1-6'   # 台灣 18:30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 正常 1~2 分鐘；首次建檔要抓 1995 至今約 380 個月（每月 sleep 400ms）約 4~5 分鐘。
    # 沒有這行，證交所卡住時會空轉到預設的 6 小時上限。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 腳本用 __dirname 定位輸出，從 repo 根執行也會正確寫到 timing/ 底下。
      - name: 抓取資料並更新
        run: node timing/scripts/update_data.js

      - name: 若有變更則 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add timing/data.json timing/taiex_daily.json
          if git diff --staged --quiet; then
            echo "無變更，略過 commit。"
          else
            # ⚠ 不要加 [skip ci]：用 GITHUB_TOKEN 推的 commit 本來就不會觸發其他
            #   workflow，加了不但多餘，還可能一併擋掉 Pages 的 pages build and deployment。
            git commit -m "chore: 更新每日資料"
            git push
          fi
