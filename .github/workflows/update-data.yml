name: update-data

on:
  schedule:
    # 每日 10:30 UTC ≈ 台灣時間 18:30，證交所收盤（13:30）結算後。
    # 刻意壓在整點之後：GitHub 排程共用佇列，整點是尖峰，常態會再延遲 5~30 分鐘。
    # 週一～週六：週六那次是為了補抓週五收盤（排程本身可能延遲）。
    - cron: '30 10 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 正常 1~2 分鐘；首次建檔要抓 1995 至今約 380 個月（每月 sleep 400ms）約 4~5 分鐘。
    # 沒有這行，證交所卡住時會空轉到預設的 6 小時上限。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 腳本用 __dirname 定位輸出，從 repo 根執行也會正確寫到 timing/ 底下。
      - name: 抓取資料並更新
        run: node timing/scripts/update_data.js

      - name: 若有變更則 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add timing/data.json timing/taiex_daily.json
          if git diff --staged --quiet; then
            echo "無變更，略過 commit。"
          else
            # ⚠ 不要加 [skip ci]：用 GITHUB_TOKEN 推的 commit 本來就不會觸發其他
            #   workflow，加了不但多餘，還可能一併擋掉 Pages 的 pages build and deployment。
            git commit -m "chore: 更新每日資料"
            git push
          fi
